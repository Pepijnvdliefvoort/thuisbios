<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thuisbios banner</title>
<style>
  :root { --bg: #0b0b10; --surface: #17171f; --fg: #f2f2f5; --muted: #9a9aa8; --accent: #e50914; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); }
  .banner {
    position: relative; width: 1280px; height: 400px; overflow: hidden; color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(ellipse 60% 120% at 88% 40%, rgba(229, 9, 20, 0.22) 0%, rgba(229, 9, 20, 0) 60%),
      radial-gradient(ellipse 50% 90% at 5% 110%, rgba(60, 70, 160, 0.20) 0%, rgba(60, 70, 160, 0) 60%),
      linear-gradient(135deg, #12121a 0%, #0b0b10 100%);
  }
  /* Tilted poster collage on the right; every column is a strip of generated placeholder posters. */
  .collage { position: absolute; top: -160px; right: -150px; width: 720px; height: 760px; transform: rotate(-14deg); display: flex; gap: 18px; }
  .col { display: flex; flex-direction: column; gap: 18px; }
  .col:nth-child(1) { margin-top: 60px; }
  .col:nth-child(2) { margin-top: -40px; }
  .col:nth-child(3) { margin-top: 90px; }
  .col:nth-child(4) { margin-top: -10px; }
  .col img { width: 150px; height: 225px; border-radius: 10px; display: block; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55); }
  .fade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--bg) 0%, var(--bg) 28%, rgba(11, 11, 16, 0.7) 46%, rgba(11, 11, 16, 0) 68%); }
  .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.55); }
  .text { position: absolute; left: 72px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; max-width: 640px; }
  .mark { display: flex; align-items: center; gap: 22px; }
  .mark img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5); }
  h1 { margin: 0; font-size: 92px; line-height: 1; font-weight: 800; letter-spacing: -1.5px; color: var(--fg); }
  h1 span { color: var(--accent); }
  .tagline { margin: 26px 0 0; font-size: 26px; line-height: 1.3; font-weight: 500; color: var(--fg); max-width: 560px; }
  .sub { margin: 18px 0 0; font-size: 16px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
  .bar { width: 64px; height: 5px; border-radius: 3px; background: var(--accent); margin-top: 26px; }
</style>
</head>
<body>
<div class="banner">
  <div class="collage" id="collage"></div>
  <div class="fade"></div>
  <div class="vignette"></div>
  <div class="text">
    <div class="mark">
      <img src="../../apps/remote/public/icon-512.png" alt="">
      <h1>Thuis<span>bios</span></h1>
    </div>
    <div class="bar"></div>
    <p class="tagline">Your own movies and shows, Netflix-style, on your TV and phone.</p>
    <p class="sub">Self-hosted · Jellyfin · Samsung Tizen · Phone remote</p>
  </div>
</div>
<script>
  // Posters come from the mock server (generic placeholder art). ?mock=http://host:port overrides the address.
  var mock = new URLSearchParams(location.search).get('mock') || 'http://localhost:8097';
  var films = [2, 9, 4, 11, 6, 1, 12, 7, 3, 10, 5, 8];
  var html = '';
  for (var c = 0; c < 4; c++) {
    html += '<div class="col">';
    for (var r = 0; r < 3; r++) {
      var n = films[(c * 3 + r) % films.length];
      html += '<img src="' + mock + '/Items/film-' + (n < 10 ? '0' : '') + n + '/Images/Primary?maxWidth=300" alt="">';
    }
    html += '</div>';
  }
  document.getElementById('collage').innerHTML = html;
</script>
</body>
</html>
