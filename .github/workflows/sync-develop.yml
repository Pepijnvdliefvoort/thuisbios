name: Sync develop

on:
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR from main into develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          existing=$(gh pr list --base develop --head main --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR from main to develop already exists; skipping."
            exit 0
          fi
          gh pr create --base develop --head main \
            --title "chore: sync main into develop after $TAG" \
            --body "Automated back-merge of release $TAG from main into develop. Merge with a merge commit."
