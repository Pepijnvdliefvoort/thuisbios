name: README screenshots

# Gate on the release PR from develop into main. Regenerates docs/images from the mock Jellyfin
# (scripts/screenshots) when the release PR is opened or updated (and on demand). When the images are
# out of date it opens (or updates) a docs/readme-screenshots PR into develop and fails the check until
# that PR is merged; merging it moves develop, which re-runs this check against the updated release PR.
# Make "README screenshots up to date" a required check on the main ruleset to block a too-early merge.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-screenshots-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    name: README screenshots up to date
    # Manual runs, or release PRs whose head is develop in this same repo (not forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      BRANCH: docs/readme-screenshots
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || 'develop' }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is not a project dependency (see scripts/screenshots/README.md): install it globally.
      - name: Install Playwright with Chromium
        run: |
          npm install -g playwright@1.63.0
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
      - name: Install Pillow (optimize.py)
        run: python3 -m pip install --user pillow
      - name: Capture screenshots
        run: node scripts/screenshots/capture.mjs
      # Drop images that only differ by invisible raster noise, so they do not count as changed.
      - name: Ignore pixel noise
        run: python3 scripts/screenshots/revert-noise.py
      - name: Commit and open or update the PR
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/images)" ]; then
            echo "README screenshots are up to date; nothing to do."
            exit 0
          fi
          git config user.name Pepijnvdliefvoort
          git config user.email 25536220+Pepijnvdliefvoort@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add docs/images
          git commit -m "docs: update README screenshots"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR from $BRANCH already open; the force-push updated it."
            url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url')
          else
            url=$(gh pr create --base develop --head "$BRANCH" \
              --title "docs: update README screenshots" \
              --body "**Merge with: Squash and merge**

          Regenerated for the release PR into main. Merge this first (Squash and merge); the release PR's screenshot check then re-runs and turns green.")
          fi
          msg="README screenshots are out of date. Merge $url into develop first (Squash and merge); this check re-runs and turns green."
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "$msg"
