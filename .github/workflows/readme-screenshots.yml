name: README screenshots

# Regenerates docs/images from the mock Jellyfin (scripts/screenshots) when a release PR from develop
# into main is opened (and on demand), and opens (or updates) a PR into develop when the images changed.
# The owner merges it like any other PR; the release PR picks it up because its head is develop.
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: readme-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    # Manual runs, or release PRs whose head is develop in this same repo (not forks).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      BRANCH: docs/readme-screenshots
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright is not a project dependency (see scripts/screenshots/README.md): install it globally.
      - name: Install Playwright with Chromium
        run: |
          npm install -g playwright@1.63.0
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
          playwright install --with-deps chromium
      - name: Install Pillow (optimize.py)
        run: python3 -m pip install --user pillow
      - name: Capture screenshots
        run: node scripts/screenshots/capture.mjs
      - name: Commit and open or update the PR
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain docs/images)" ]; then
            echo "Screenshots unchanged; nothing to do."
            exit 0
          fi
          git config user.name Pepijnvdliefvoort
          git config user.email 25536220+Pepijnvdliefvoort@users.noreply.github.com
          git checkout -B "$BRANCH"
          git add docs/images
          git commit -m "docs: update README screenshots"
          git push --force origin "$BRANCH"
          existing=$(gh pr list --base develop --head "$BRANCH" --state open --json number --jq 'length')
          if [ "$existing" -gt 0 ]; then
            echo "PR from $BRANCH already open; the force-push updated it."
            exit 0
          fi
          gh pr create --base develop --head "$BRANCH" \
            --title "docs: update README screenshots" \
            --body "**Merge with: Squash and merge**

          Regenerated automatically from the mock Jellyfin (\`scripts/screenshots\`) for the release PR into main. Merge this first (Squash and merge); the release PR then picks it up automatically because its head is develop."
