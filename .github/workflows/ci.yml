name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npx --yes markdownlint-cli2

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-versions.mjs

  tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w apps/tv
      - name: Test
        run: npm test -w apps/tv
      - name: Build
        run: npm run build -w apps/tv
      - name: Check build output is ES2017 only (Chromium 56)
        run: npm run check:dist -w apps/tv
      - uses: actions/upload-artifact@v4
        with:
          name: tv-dist
          path: apps/tv/dist
          if-no-files-found: error

  remote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck -w apps/remote
      - name: Test
        run: npm test -w apps/remote
      - name: Build
        run: npm run build -w apps/remote
      - uses: actions/upload-artifact@v4
        with:
          name: remote-dist
          path: apps/remote/dist
          if-no-files-found: error

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          & ./.github/scripts/Install-CiModule.ps1 -Name PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path server -Recurse -Settings server/PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          if ($results | Where-Object Severity -eq 'Error') { exit 1 }
      - name: Install Pester 5
        shell: pwsh
        run: |
          & ./.github/scripts/Install-CiModule.ps1 -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
      - name: Pester (PowerShell 7)
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          Invoke-Pester -Path server/tests -CI -Output Detailed
      - name: Pester (Windows PowerShell 5.1)
        shell: powershell
        run: |
          & ./.github/scripts/Install-CiModule.ps1 -Name Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          Invoke-Pester -Path server/tests -CI -Output Detailed
